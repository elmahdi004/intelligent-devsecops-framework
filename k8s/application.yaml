apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flint
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/elmahdibellaziz/flint.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: flint
  syncPolicy:
    syncOptions:
      - CreateNamespace=true